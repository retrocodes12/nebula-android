name: Compare

# Nebula beside Nuvio (a competitor; its PUBLISHED builds, installed and observed only) on identical emulators: the same
# journey walked in both (scripts/compare.py), a screenshot + a uiautomator dump per state under paired names. Runs on
# the `compare` branch only; builds release (debug-signed) for Nebula, publishes nothing.
on:
  push:
    branches: [ compare ]
  workflow_dispatch:

jobs:
  compare:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: nebula-phone
            app: nebula
            api: 34
            target: google_apis
            profile: pixel_6
            arch: x86_64
          - job: nuvio-phone
            app: nuvio
            repo: NuvioMedia/NuvioMobile
            asset: androidApp-full-x86_64-release.apk
            api: 34
            target: google_apis
            profile: pixel_6
            arch: x86_64
          - job: nebula-tv
            app: nebula
            api: 34
            target: android-tv
            profile: tv_1080p
            arch: x86
          - job: nuvio-tv
            app: nuvio
            repo: NuvioMedia/NuvioTV
            asset: app-full-x86-release.apk
            api: 34
            target: android-tv
            profile: tv_1080p
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        if: matrix.app == 'nebula'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: matrix.app == 'nebula'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble release (debug-signed without the keystore, with the emulator ABIs)
        if: matrix.app == 'nebula'
        run: gradle assembleRelease --no-daemon -PemulatorAbis
      - name: Nuvio's published build (latest release)
        if: matrix.app == 'nuvio'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ${{ matrix.repo }} -p '${{ matrix.asset }}' -O nuvio.apk
          gh release view -R ${{ matrix.repo }} --json tagName -q .tagName | tee nuvio-version.txt
          ls -l nuvio.apk
      - name: The runner's stream add-on (the emulator reaches it at 10.0.2.2:8799)
        run: nohup python3 scripts/rig-addon.py > /dev/null 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The journey on the emulator
        # the x86 TV emulator is slow: past this the step stops and whatever was shot is still uploaded
        timeout-minutes: 38
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/compare.py ${{ matrix.job }}
      - name: Keep the version shot
        if: always() && matrix.app == 'nuvio'
        run: mkdir -p cmp && cp nuvio-version.txt cmp/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmp-${{ matrix.job }}
          path: cmp/
