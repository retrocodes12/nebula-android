name: Compile check

# Build-only verification for branches and PRs. Deliberately no signing secrets
# and no release step — publishing lives in build.yml, which only runs on main.
on:
  pull_request:
  push:
    branches-ignore: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug
        run: gradle assembleDebug --no-daemon --stacktrace
