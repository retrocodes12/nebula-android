name: Compile check

# Build-only verification for branches and PRs. Deliberately no signing secrets
# and no release step — publishing lives in build.yml, which only runs on main.
on:
  pull_request:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      # Convert sound for your TV (SoundShare.kt): the small FFmpeg it runs (DTS in, Dolby Digital Plus out), built from
      # source by scripts/build-ffmpeg.sh once per change of that script and kept in the cache
      - name: Cache the sound converter
        id: ffcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libnebulaff.so
          key: nebulaff-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build the sound converter
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      - name: Assemble debug
        run: gradle assembleDebug --no-daemon --stacktrace

      # JVM unit tests (app/src/test): a failing test fails the branch. The second step reads the JUnit reports so a
      # green run that ran nothing (a test source set that stopped being picked up) fails too.
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Unit tests ran
        run: |
          DIR=app/build/test-results/testDebugUnitTest
          N=$(cat "$DIR"/*.xml 2>/dev/null | grep -o '<testsuite [^>]*' | sed -n 's/.* tests="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
          echo "JVM unit tests in the reports: $N"
          [ "$N" -gt 0 ] || { echo "::error::no unit tests ran"; exit 1; }

      # a release without the converter would offer a switch that does nothing
      - name: Sound converter is packaged
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$abi/libnebulaff.so" \
              || { echo "::error::libnebulaff.so missing for $abi"; exit 1; }
          done

      # P2P streams are dead on arrival if libtorrent's native library misses the APK — it comes
      # from a plain jar's lib/<abi>/ rather than an AAR, which is easy to lose in a dependency
      # change and impossible to notice from a green compile. There is no device rig, so assert here.
      - name: P2P engine is packaged
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK $(du -h "$APK" | cut -f1)"
          unzip -v "$APK" | grep 'lib/.*\.so' || true
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$abi/libtorrent4j.so" \
              || { echo "::error::libtorrent4j.so missing for $abi"; exit 1; }
          done
