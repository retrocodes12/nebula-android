name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ---- the launch gate: no release until a release build has opened on an emulator ----
      # The debug build of this app fails ART verification (PlayerScreen is one very large method); the release build
      # passes only because D8 packs its registers differently. If that ever tips over, every install would crash at
      # launch, the in-app updater with it — so a release build must first install, reach Home and play a test stream
      # on an emulator (scripts/launch-gate.py). The emulator copy is the same code and dex plus x86 libraries.
      - name: Build the emulator copy (release, debug-signed, x86 libraries in)
        run: |
          gradle assembleRelease --no-daemon -PemulatorAbis
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "$RUNNER_TEMP/gate.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch gate on an emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/launch-gate.py ${{ runner.temp }}/gate.apk

      # the same gate on Android 9 (a TV box or an older phone): proven there by the Screens gate28 job first
      - name: Launch gate on Android 9
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/launch-gate.py ${{ runner.temp }}/gate.apk

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.NEBULA_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nebula-release.jks"

      - name: Build release APK
        env:
          NEBULA_KEYSTORE_FILE: ${{ runner.temp }}/nebula-release.jks
          NEBULA_STORE_PASSWORD: ${{ secrets.NEBULA_STORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          "-PnebulaKeystore=$NEBULA_KEYSTORE_FILE"
          "-PnebulaStorePassword=$NEBULA_STORE_PASSWORD"
          "-PnebulaKeyAlias=$NEBULA_KEY_ALIAS"
          "-PnebulaKeyPassword=$NEBULA_KEY_PASSWORD"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" Nebula-1.79.0.apk
          cp "$APK" Nebula.apk
          gh release delete v1.79.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.79.0 Nebula-1.79.0.apk Nebula.apk \
            --title "Nebula (Android phone + TV) v1.79.0" \
            --notes "A full audit pass. Friends are now mutual: someone you add sees your watching only once they add you back, and asks to be friends show up for you to add back or dismiss. The next episode never starts after you press Back, long lists page smoothly, a landscape phone shows the pause board, a title page puts Play before the cast, stream names lose their emoji, a download no longer starts over, your sign-in is kept out of device backups, and on a TV the remote lands somewhere useful on an empty streams page and after a Friends action. Every release is now opened on an emulator before it ships."
