name: Build APK

# Two ways out of this file:
#   * a push to `main` IS the release: gate, sign, then (re)create the release v<X.Y.Z> with Nebula-X.Y.Z.apk AND the
#     evergreen Nebula.apk that every short link and the in-app updater's fallback point at (releases/latest).
#   * a push to `beta` is an EARLY BUILD for Plus-level supporters who switched Early builds on (the cloud's
#     /v1/releases offers `android.beta` when a pre-release newer than the release exists): the same gate and the same
#     signing, then a GitHub PRE-RELEASE v<versionName> carrying ONLY Nebula-<versionName>.apk. It never uploads or
#     replaces Nebula.apk, never touches a release that is not a pre-release, and a pre-release is never "latest", so
#     releases/latest (and with it da.gd/nebulaapk, Downloader code 7664693) keeps pointing at the stable build.
#     The beta branch's versionName must read X.Y.Z-beta.N (checked below), and its versionCode is the one its stable
#     X.Y.Z will use: the stable build then installs over the early one (an equal versionCode is allowed), and the
#     app's own comparison already ranks X.Y.Z above X.Y.Z-beta.N (Updates.compareVersions).
# A workflow_dispatch on any other branch gates, builds, signs and checks the signature, and publishes nothing.
on:
  push:
    branches: [ main, beta ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

# Read-only unless a job says otherwise: only the release job writes, and only it ever sees the signing key. Every action is
# pinned by commit (a moved tag cannot swap its code), and the emulator gate — which runs third-party code — runs in its own
# job with no secrets at all, so nothing it starts can still be running when the keystore is decoded (2026-09-24).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # no step after this needs the token in .git/config

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      # ---- the launch gate: no release until a release build has opened on an emulator ----
      # The debug build of this app fails ART verification (PlayerScreen is one very large method); the release build
      # passes only because D8 packs its registers differently. If that ever tips over, every install would crash at
      # launch, the in-app updater with it — so a release build must first install, reach Home and play a test stream
      # on an emulator (scripts/launch-gate.py). The emulator copy is the same code and dex plus x86 libraries.
      - name: Build the emulator copy (release, debug-signed, x86 libraries in)
        run: |
          gradle assembleRelease --no-daemon -PemulatorAbis
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "$RUNNER_TEMP/gate.apk"

      # The release is shrunk by R8 (app/proguard-rules.pro), so the gate also plays AV1 through the FFmpeg decoder (the
      # emulator has no AV1 chip, so the app hands AV1 to nextlib's dav1d at once): native code calling Java by name is
      # what a shrinker breaks without a word until it runs. Two minutes of ffmpeg's own 720p test picture — no download.
      - name: Make the AV1 test clip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p "$RUNNER_TEMP/av1"
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=1280x720:r=24" -t 120 -c:v libsvtav1 -preset 10 -crf 40 -g 48 \
            -pix_fmt yuv420p -an -movflags +faststart "$RUNNER_TEMP/av1/av1.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 "$RUNNER_TEMP/av1/av1.mp4"
          ls -la "$RUNNER_TEMP/av1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch gate on an emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/launch-gate.py ${{ runner.temp }}/gate.apk ${{ runner.temp }}/av1/av1.mp4

      # the same gate on Android 9 (a TV box or an older phone): proven there by the Screens gate28 job first
      - name: Launch gate on Android 9
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/launch-gate.py ${{ runner.temp }}/gate.apk

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # no step after this needs the token in .git/config

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.NEBULA_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nebula-release.jks"

      - name: Build release APK
        env:
          NEBULA_KEYSTORE_FILE: ${{ runner.temp }}/nebula-release.jks
          NEBULA_STORE_PASSWORD: ${{ secrets.NEBULA_STORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        # the passwords reach Gradle through the environment (app/build.gradle.kts), never as -P arguments on a command line
        run: gradle assembleRelease --no-daemon --stacktrace

      # never publish a debug-signed APK: installs would refuse it as an update, and the updater would offer it anyway
      - name: Check the release signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt" | grep -i 'certificate DN'
          grep -qi 'CN=Nebula Player' "$RUNNER_TEMP/certs.txt" || { echo "::error::the release APK is not signed with the Nebula key"; exit 1; }
          rm -f "$RUNNER_TEMP/nebula-release.jks"

      # a run started on another branch keeps its signed APK for a day, for a test install on a phone (never published)
      - name: Keep the test build
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nebula-test-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

      # a run started on another branch (workflow_dispatch) gates, builds, signs and checks the signature, and publishes nothing
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" Nebula-1.87.0.apk
          cp "$APK" Nebula.apk
          gh release delete v1.87.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.87.0 Nebula-1.87.0.apk Nebula.apk \
            --title "Nebula (Android phone + TV) v1.87.0" \
            --notes "Smoother on Android TV and phones: cards, rows and screens move without stutter, Home and Search fill several rows at once, and the player stops redrawing everything while a film plays. The remote does more: Back on Home goes to the top before it leaves, Play opens or plays what is lit, Menu opens its options, CH+/CH- move a page at a time, the Search button opens Search, and in the player Info shows playback details, Previous steps back and Stop leaves. Media buttons no longer start other apps while Nebula is open, and a headset or the TV home screen can no longer start a film while Nebula is in the background. The Subtitles panel hides the controls behind it, the pause board stays clear of the controls on TVs, and a phone player toolbar fits the screen. Searches that reach no add-on and series that will not load now say so with Retry, and errors read as plain sentences. The download is a third smaller. (1.86.0: pick the line you just heard to time add-on subtitles.)"

      # the early build (see the top of this file): a pre-release of its own, only its versioned APK, never Nebula.apk
      - name: Publish early build (pre-release)
        if: github.ref == 'refs/heads/beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "early build: $VER"
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' \
            || { echo "::error::the beta branch's versionName must read X.Y.Z-beta.N (found '$VER')"; exit 1; }
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "Nebula-$VER.apk"
          # a tag that already exists may only be an earlier upload of this same early build — never a release
          if gh release view "v$VER" --json isPrerelease --jq .isPrerelease > "$RUNNER_TEMP/pre.txt" 2>/dev/null; then
            [ "$(cat "$RUNNER_TEMP/pre.txt")" = "true" ] \
              || { echo "::error::v$VER exists and is not a pre-release — refusing to touch it"; exit 1; }
            gh release delete "v$VER" -y --cleanup-tag
          fi
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/notes.txt"
          gh release create "v$VER" "Nebula-$VER.apk" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nebula (Android phone + TV) v$VER — early build" \
            --notes-file "$RUNNER_TEMP/notes.txt"
