name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.NEBULA_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nebula-release.jks"

      - name: Build release APK
        env:
          NEBULA_KEYSTORE_FILE: ${{ runner.temp }}/nebula-release.jks
          NEBULA_STORE_PASSWORD: ${{ secrets.NEBULA_STORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          "-PnebulaKeystore=$NEBULA_KEYSTORE_FILE"
          "-PnebulaStorePassword=$NEBULA_STORE_PASSWORD"
          "-PnebulaKeyAlias=$NEBULA_KEY_ALIAS"
          "-PnebulaKeyPassword=$NEBULA_KEY_PASSWORD"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" Nebula-1.57.0.apk
          cp "$APK" Nebula.apk
          gh release delete v1.57.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.57.0 Nebula-1.57.0.apk Nebula.apk \
            --title "Nebula (Android phone + TV) v1.57.0" \
            --notes "P2P streams. Some add-ons answer with a torrent rather than a link, and until now Nebula ignored those rows completely. Settings > Streams > P2P streams turns them on: they are listed like any other stream with a P2P mark and their seed count, and playing one runs a real engine on the phone that pulls the file from the swarm in order and feeds it to the player. It is off until you turn it on, because while a P2P stream plays everyone else in that swarm can see this device address. Downloads are cleared when the player closes unless you ask to keep them, and the playback Info panel shows peers, speed and how much of the file is here."
