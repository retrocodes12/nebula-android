name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

# Read-only unless a job says otherwise: only the release job writes, and only it ever sees the signing key. Every action is
# pinned by commit (a moved tag cannot swap its code), and the emulator gate — which runs third-party code — runs in its own
# job with no secrets at all, so nothing it starts can still be running when the keystore is decoded (2026-09-24).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # no step after this needs the token in .git/config

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      # ---- the launch gate: no release until a release build has opened on an emulator ----
      # The debug build of this app fails ART verification (PlayerScreen is one very large method); the release build
      # passes only because D8 packs its registers differently. If that ever tips over, every install would crash at
      # launch, the in-app updater with it — so a release build must first install, reach Home and play a test stream
      # on an emulator (scripts/launch-gate.py). The emulator copy is the same code and dex plus x86 libraries.
      - name: Build the emulator copy (release, debug-signed, x86 libraries in)
        run: |
          gradle assembleRelease --no-daemon -PemulatorAbis
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "$RUNNER_TEMP/gate.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch gate on an emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/launch-gate.py ${{ runner.temp }}/gate.apk

      # the same gate on Android 9 (a TV box or an older phone): proven there by the Screens gate28 job first
      - name: Launch gate on Android 9
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/launch-gate.py ${{ runner.temp }}/gate.apk

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # no step after this needs the token in .git/config

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.NEBULA_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nebula-release.jks"

      - name: Build release APK
        env:
          NEBULA_KEYSTORE_FILE: ${{ runner.temp }}/nebula-release.jks
          NEBULA_STORE_PASSWORD: ${{ secrets.NEBULA_STORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        # the passwords reach Gradle through the environment (app/build.gradle.kts), never as -P arguments on a command line
        run: gradle assembleRelease --no-daemon --stacktrace

      # never publish a debug-signed APK: installs would refuse it as an update, and the updater would offer it anyway
      - name: Check the release signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt" | grep -i 'certificate DN'
          grep -qi 'CN=Nebula Player' "$RUNNER_TEMP/certs.txt" || { echo "::error::the release APK is not signed with the Nebula key"; exit 1; }
          rm -f "$RUNNER_TEMP/nebula-release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" Nebula-1.80.0.apk
          cp "$APK" Nebula.apk
          gh release delete v1.80.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.80.0 Nebula-1.80.0.apk Nebula.apk \
            --title "Nebula (Android phone + TV) v1.80.0" \
            --notes "Title pages have a Universe row: what a film or show follows, what follows it, its spin-offs and what it spun off from, and its remakes, each card labelled with how it is connected. Open one to see its page; Back brings you to the title you came from."
