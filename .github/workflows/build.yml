name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]   # docs-only pushes must not re-cut the release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.NEBULA_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nebula-release.jks"

      - name: Build release APK
        env:
          NEBULA_KEYSTORE_FILE: ${{ runner.temp }}/nebula-release.jks
          NEBULA_STORE_PASSWORD: ${{ secrets.NEBULA_STORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.NEBULA_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          "-PnebulaKeystore=$NEBULA_KEYSTORE_FILE"
          "-PnebulaStorePassword=$NEBULA_STORE_PASSWORD"
          "-PnebulaKeyAlias=$NEBULA_KEY_ALIAS"
          "-PnebulaKeyPassword=$NEBULA_KEY_PASSWORD"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" Nebula-1.68.0.apk
          cp "$APK" Nebula.apk
          gh release delete v1.68.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v1.68.0 Nebula-1.68.0.apk Nebula.apk \
            --title "Nebula (Android phone + TV) v1.68.0" \
            --notes "$(printf 'A design pass over the whole app, from an audit of every screen.\n\nTitle pages: the backdrop now scrolls away with the header instead of showing through the episode list, Play lines up with the round buttons beside it, the description opens with More, and the details table only tells you what the page has not already said.\n\nPlayer: Audio and Quality open in the player’s own panel rather than a system dialog. When a stream will not play you get a sentence and a way back to the other sources, not an error code. The sleep timer closes with Back. The scrubber is easier to hit.\n\nSubtitles on a phone: the three columns stack and scroll as one page, so the tracks and the style controls are no longer hidden off to the right.\n\nEverywhere: selected rows, buttons and stars show a white ring on a TV, empty screens all look alike, removing an add-on asks first, and searching tells you when your add-ons could not be reached instead of saying there are no matches.')"
