name: Device tests

# On-device tests (app/src/androidTest) on an emulator: the subtitle sync's ear against real Media3 decoding.
# The media is Tears of Steel (CC BY 3.0, Blender Foundation), downloaded and cut here, never committed.
on:
  workflow_dispatch:
  push:
    branches: [ 'device-*' ]

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Make the test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          A=app/src/androidTest/assets; mkdir -p $A/tos-hls
          curl -sSfL -o tos.ac3 "https://download.blender.org/demo/movies/ToS/Surround-TOS_DVDSURROUND-Dolby%205.1.ac3"
          curl -sSfL -o $A/tos.srt https://download.blender.org/demo/movies/ToS/subtitles/TOS-en.srt
          DM="pan=stereo|FL=FL+0.707*FC+0.707*SL|FR=FR+0.707*FC+0.707*SR"
          ffmpeg -v error -y -i tos.ac3 -t 360 -af "$DM" -c:a aac -b:a 96k $A/tos-stereo.mkv
          ffmpeg -v error -y -i tos.ac3 -t 360 -c:a aac -ac 6 -b:a 192k $A/tos-51.mp4
          ffmpeg -v error -y -i tos.ac3 -t 360 -af "$DM" -c:a aac -b:a 96k -f hls -hls_time 6 -hls_playlist_type vod -hls_segment_filename "$A/tos-hls/seg%03d.ts" $A/tos-hls/index.m3u8
          ls -la $A $A/tos-hls | head -12

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device tests on an emulator (API 34)
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon -PemulatorAbis --stacktrace || touch /tmp/gradle-failed; adb logcat -d | grep -E "SUBSYNC-DEVICE|AndroidRuntime|TestRunner" | tail -60; test -z "$(find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l '<failure' {} +)" && test ! -e /tmp/gradle-failed
