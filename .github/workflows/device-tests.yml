name: Device tests

# On-device tests (app/src/androidTest) on an emulator, against real Media3 decoding: Seekr's sprite sheets and AV1.
# The media is made here (ffmpeg's test source, the Sintel trailer — CC BY, Blender Foundation), never committed.
on:
  workflow_dispatch:
  push:
    branches: [ 'device-*' ]

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Make the test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          A=app/src/androidTest/assets; mkdir -p $A
          # a Seekr-sized sprite sheet (3200×1800 JPEG, ~0.5 MB like the real ones) for SeekrFramesDeviceTest
          ffmpeg -v error -y -f lavfi -i "testsrc2=s=3200x1800:d=1,noise=alls=10:allf=t" -frames:v 1 -q:v 6 $A/sheet.jpg
          # a 1080p AV1 clip (Sintel trailer, CC BY, Blender Foundation) for Av1DecodeDeviceTest
          curl -sSfL -o sintel.mp4 https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4
          ffmpeg -v error -y -ss 4 -t 24 -i sintel.mp4 -an -c:v libsvtav1 -preset 10 -crf 32 -g 48 -pix_fmt yuv420p $A/av1.mkv
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 $A/av1.mkv
          ls -la $A | head -12

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device tests on an emulator (API 34)
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: gradle connectedDebugAndroidTest --no-daemon -PemulatorAbis --stacktrace || touch /tmp/gradle-failed; adb logcat -d | grep -E "AV1-DEVICE|SEEKR-DEVICE|AndroidRuntime|TestRunner|ExoPlayerImplInternal|MediaCodec|nextlib|Ffmpeg" | tail -120; test -z "$(find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l '<failure' {} +)" && test ! -e /tmp/gradle-failed
