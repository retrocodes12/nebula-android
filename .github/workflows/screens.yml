name: Screens

# Renders the app on an emulator and keeps the screenshots as an artifact — the only way anyone
# here sees the Android UI (there is no device). Runs on the `screens` branch only; builds debug,
# publishes nothing.
on:
  push:
    branches: [ screens ]

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            target: google_apis
            profile: pixel_6
            arch: x86_64
          - name: tv
            target: android-tv
            profile: tv_1080p
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble release (debug-signed without the keystore) and debug
        run: gradle assembleRelease assembleDebug --no-daemon -PemulatorAbis
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screens on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/screens.py ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.name }}
          path: screens/
